# Core AI constants configuration
# These values control basic AI behavior parameters

# Base likelihood to change movement action (lower is more likely to change)
base_act_chance = 5

# Base likelihood to jump while moving forwards (lower is more likely)
base_fwd_jump_chance = 5

# Base likelihood to jump while moving backwards (lower is more likely)
base_back_jump_chance = 5

# Base likelihood to jump while standing still (lower is more likely)
base_still_jump_chance = 40

# Likelihood of attempting a random attack/tactic (lower is more likely)
random_attack_chance = 10

# Base action timer duration (frames before AI considers changing actions)
base_act_timer = 28
