# Punching Bag - Very passive, just defends
# These values override base ai_core.ini settings

# Change movement action less frequently (lower = more likely to change)
base_act_chance = 25

# Jump while moving forward - very rare
base_fwd_jump_chance = 60

# Jump while moving backward - very rare
base_back_jump_chance = 60

# Jump while standing still - almost never
base_still_jump_chance = 90

# Attack/tactic selection - very rare
random_attack_chance = 60

# How long to stick with current action (frames)
base_act_timer = 50

# Likelihood to block instead of attacking
block_chance = 70

# 0 = default tactic gating, 1 = also allow advanced tactics (e.g. COUNTER)
aggressive_tactics = 0

# Jump frequency multiplier applied as a divisor (100 = normal, higher = jump more often)
jump_frequency_mult = 30
